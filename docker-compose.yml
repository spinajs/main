# Databases for the ORM integration suites.
#
# Opt-in only: every service sits behind the `test` profile, so a bare `docker compose up`
# starts nothing. Bring MySQL up with:
#
#   docker compose --profile test up -d mysql
#
# See "Running integration tests" in README.md.

services:
  mysql:
    profiles: ['test']
    # Pinned, not `mysql:8`. That floating tag now resolves to 8.4.x, and the version the
    # suite runs against must not change under us on an image pull.
    image: mysql:8.4
    container_name: spinajs-orm-test-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      # `test` is created by the image; `test-2` comes from the init script below,
      # because MYSQL_DATABASE only ever creates one.
      MYSQL_DATABASE: test
    command:
      # No --default-authentication-plugin here. MySQL 8.4 *removed* that server variable
      # and refuses to start when it is passed. It is also unnecessary: mysql2 (3.x) speaks
      # caching_sha2_password natively, which is what MySQL 8 defaults to in production —
      # so leaving the default alone makes this fixture more representative, not less.
      #
      # small pool on the server side too, so a leaked connection surfaces as a failure
      # rather than being absorbed
      - --max-connections=32
    ports:
      # deliberately not 3306: never collide with a MySQL already installed on the host.
      # 3900 is what packages/orm-mysql/test expects.
      - '3900:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  mssql:
    profiles: ['test']
    # The orm-mssql suite connects to localhost:1433 as `sa` with the password below
    # ( packages/orm-mssql/test/mssql.test.ts ). Without this service those tests fail on
    # "Could not connect (sequence)" — there was never a fixture for them.
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: spinajs-orm-test-mssql
    restart: unless-stopped
    environment:
      # Required by the image; running it means accepting Microsoft's EULA.
      ACCEPT_EULA: 'Y'
      # Must match packages/orm-mssql/test/mssql.test.ts, and satisfy SQL Server's own
      # complexity rules ( upper, lower, digit, symbol, 8+ chars ).
      MSSQL_SA_PASSWORD: 'yourStrong(!)Password'
      MSSQL_PID: 'Developer'
    ports:
      - '1433:1433'
    volumes:
      - mssql-data:/var/opt/mssql
      - ./scripts/docker/mssql-init:/init:ro
    healthcheck:
      # `-C` trusts the self-signed cert the container generates; without it sqlcmd 18+
      # refuses the connection and the healthcheck never goes green.
      test: ['CMD-SHELL', '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # One-shot: creates the schemas the suite expects, then exits. The SQL Server image runs
  # nothing from a mount the way the mysql image runs /docker-entrypoint-initdb.d, so the
  # init has to be driven from outside once the server reports healthy.
  mssql-init:
    profiles: ['test']
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: spinajs-orm-test-mssql-init
    restart: 'no'
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./scripts/docker/mssql-init:/init:ro
    entrypoint:
      - /bin/bash
      - -c
      - '/opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "yourStrong(!)Password" -C -i /init/01-create-databases.sql'

volumes:
  mysql-data:
  mssql-data:
