name: release
on:
  push:
    branches: [master]
  schedule:
    - cron: '0 9 * * 1' # weekly train, Monday 09:00 UTC
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to run the changesets action'
        required: false
        default: ''
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: { group: release-master, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.RELEASE_TOKEN }}", fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.x, cache: npm, registry-url: https://registry.npmjs.org }
      - run: npm ci
      - run: npm run build
      - run: node scripts/test-all.mjs --ci
      # dry-run guard until Task A9 removes it
      - if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish'
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "release: version packages [skip ci]"
          title: "release: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
