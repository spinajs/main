name: queue-outbox-db

# The transactional outbox of @spinajs/queue against real Postgres and MySQL: BIGINT times, insert-or-ignore,
# compare-and-set claims and affected-row counts differ per server, and sqlite shows none of it.

on:
  push:
    branches: [master]
    paths:
      - 'packages/queue/**'
      - 'packages/durable/**'
      - 'packages/orm/**'
      - 'packages/orm-sql/**'
      - 'packages/orm-postgres/**'
      - 'packages/orm-mysql/**'
      - '.github/workflows/queue-outbox-db.yml'
  pull_request:
    paths:
      - 'packages/queue/**'
      - 'packages/durable/**'
      - 'packages/orm/**'
      - 'packages/orm-sql/**'
      - 'packages/orm-postgres/**'
      - 'packages/orm-mysql/**'
      - '.github/workflows/queue-outbox-db.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spinajs_queue_outbox_test
        ports:
          - 15432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d spinajs_queue_outbox_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: spinajs_queue_outbox_test
        ports:
          - 13306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: install
        run: npm ci

      # the test imports the three drivers as test dependencies, outside queue's reference graph
      - name: build queue + drivers
        run: node node_modules/typescript-7/lib/tsc.js -b packages/queue/tsconfig.build.json packages/orm-sqlite/tsconfig.build.json packages/orm-postgres/tsconfig.build.json packages/orm-mysql/tsconfig.build.json

      - name: outbox on postgres and mysql
        working-directory: packages/queue
        env:
          TS_NODE_PROJECT: tsconfig.json
          SPINAJS_TEST_PG_HOST: 127.0.0.1
          SPINAJS_TEST_PG_PORT: 15432
          SPINAJS_TEST_PG_USER: postgres
          SPINAJS_TEST_PG_PASSWORD: postgres
          SPINAJS_TEST_PG_DB: spinajs_queue_outbox_test
          SPINAJS_TEST_MYSQL_HOST: 127.0.0.1
          SPINAJS_TEST_MYSQL_PORT: 13306
          SPINAJS_TEST_MYSQL_USER: root
          SPINAJS_TEST_MYSQL_PASSWORD: root
          SPINAJS_TEST_MYSQL_DB: spinajs_queue_outbox_test
        run: npm run test:integration
