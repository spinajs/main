name: codeql

# GitHub code scanning (taint tracking: injection, path traversal, prototype pollution, ...).
# Results show up under Security > Code scanning and as PR annotations.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    concurrency:
      group: codeql-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # TypeScript is analysed from source; no build needed.
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/lib/**'
              - '**/test/**'
              - '**/node_modules/**'

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
